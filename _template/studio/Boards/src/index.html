<!DOCTYPE html>
<html lang="en">
<head>
  <title>Boards</title>
/* @inline shared/src/head.html */
</head>
<body style="overflow:auto">
<div id="root"></div>
<script type="text/babel" data-presets="react">
/* @inline shared/src/fixture.js */
/* @inline shared/src/core.jsx */
/* @inline shared/src/kit.jsx */
/* @inline shared/src/devices.jsx */
/* @inline shared/src/board-frame.jsx */
const BOARDS_INDEX = /*__BOARDS_INDEX__*/;
// Hub: one card per board in Boards/index.json (name, nameAr, blurb, icon, screens, status). No per-project code here.
const Hub = () => {
  const [theme, setTheme] = useState('light'); const C = mkTheme(theme);
  useEffect(() => { document.body.style.background = C.bg; document.documentElement.dataset.theme = theme; document.title = `${FX.project.name} · Boards`; }, [theme]);
  const vcount = (b, v) => (b.screens || []).filter(s => s.v === v).length;
  const total = BOARDS_INDEX.reduce((a, b) => a + (b.screens || []).length, 0);
  return <ThemeCtx.Provider value={C}><LangProvider lang="en">
    <main style={{ maxWidth: 1320, margin: '0 auto', padding: '56px 32px 80px', fontFamily: FONT }}>
      <header style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 24, marginBottom: 56, flexWrap: 'wrap' }}>
        <Row gap={20} wrap><Wordmark size={40} /><Wordmark size={30} ar mark={false} ink={C.textSecondary} /></Row>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
          <span style={{ fontSize: 13, color: C.textSecondary }}>UI boards · {FX.project.boardDate} · Arabic + English</span>
          <button type="button" className="bk-focus" aria-label={theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'} onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')} style={{ width: 40, height: 40, borderRadius: 10, border: `1px solid ${C.border}`, background: C.surface, color: C.text, display: 'grid', placeItems: 'center', cursor: 'pointer' }}><Ic n={theme === 'dark' ? 'sun' : 'moon'} s={18} /></button>
        </div>
      </header>
      <h1 style={{ fontFamily: DISPLAY, fontWeight: 600, fontSize: 56, lineHeight: '62px', color: C.text, margin: 0, maxWidth: 940 }}>{FX.project.tagline.en}</h1>
      <p lang="ar" dir="rtl" style={{ fontFamily: DISPLAY_AR, fontSize: 26, lineHeight: '40px', color: C.textSecondary, marginTop: 14, maxWidth: 940, textAlign: 'start' }}>{FX.project.tagline.ar}</p>
      <p style={{ fontSize: 16, lineHeight: '24px', color: C.textSecondary, marginTop: 12 }}>{BOARDS_INDEX.length} boards · {total} screens, each drawn in Arabic and in English and tagged with the release it ships in.</p>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(290px, 1fr))', gap: 20, marginTop: 44 }}>
        {BOARDS_INDEX.map(b => { const n = (b.screens || []).length; const planned = b.status === 'planned'; const body = <>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}><IconTile n={b.icon || 'layers'} tone="primary" size={48} /><span style={{ fontFamily: MONO, fontSize: 13, fontWeight: 700, color: C.accentText }}>{b.id}</span></div>
          <div><div style={{ fontFamily: DISPLAY, fontSize: 32, color: C.text }}>{b.name}</div>{b.nameAr && <div lang="ar" style={{ fontFamily: FONT_AR, fontSize: 18, color: C.textSecondary }}>{b.nameAr}</div>}</div>
          {b.blurb && <p style={{ fontSize: 15, lineHeight: '22px', color: C.textSecondary, margin: 0 }}>{b.blurb}</p>}
          <div style={{ flex: 1 }} />
          {n > 0 ? <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', alignItems: 'center' }}><span style={{ fontSize: 13, fontWeight: 650, color: C.text, marginInlineEnd: 6 }}>{n} screens</span>{['v1', 'v2', 'v3', 'v4'].map(v => vcount(b, v) ? <VerTag key={v} v={v} /> : null)}</div> : <span style={{ fontSize: 13, fontWeight: 650, color: C.text }}>Tokens · components · shells</span>}
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, color: planned ? C.textSecondary : C.primaryText, fontWeight: 650, fontSize: 15 }}>{planned ? 'Planned' : <>Open board <Ic n="arrowR" s={16} /></>}</span>
        </>; const st = { textDecoration: 'none', color: 'inherit', background: C.surface, border: `1px solid ${C.border}`, borderRadius: 20, padding: 26, boxShadow: C.el[2], display: 'flex', flexDirection: 'column', gap: 14, minHeight: 300 };
          return planned ? <div key={b.id} style={st}>{body}</div> : <a key={b.id} href={b.file} className="bk-focus" style={st}>{body}</a>; })}
      </div>
      <footer style={{ marginTop: 56, paddingTop: 20, borderTop: `1px solid ${C.border}`, display: 'flex', justifyContent: 'space-between', fontFamily: MONO, fontSize: 12.5, color: C.textSecondary, flexWrap: 'wrap', gap: 12 }}>
        <span style={{ display: 'flex', alignItems: 'center', gap: 8 }} data-brand-bar="aviniti"><img src={AVINITI_LOGO} alt="Aviniti" width="18" height="18" />Designed by Aviniti · Your Ideas, Our Reality</span><span>{FX.project.name.toUpperCase()} · {BOARDS_INDEX.length} BOARDS</span>
      </footer>
    </main>
  </LangProvider></ThemeCtx.Provider>;
};
ReactDOM.createRoot(document.getElementById('root')).render(<Hub />);
</script>
</body>
</html>
